services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_CONNECTION: pgsql
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
